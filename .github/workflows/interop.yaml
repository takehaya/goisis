name: interop

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Continuous interop against FRR isisd: every push/PR forms adjacencies
# between goisis and a real FRR over a veth pair (broadcast and p2p).
jobs:
  frr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Pull images
        run: |
          docker pull quay.io/frrouting/frr:10.6.1
          docker pull alpine:3.22
      - name: Build root-gated tests
        run: |
          go test -c -race -o /tmp/fib.test ./pkg/fib
          go test -c -race -o /tmp/datalink.test ./pkg/datalink
          go test -c -race -o /tmp/goisisd.test ./cmd/goisisd
      - name: Run root-gated tests
        # These skip without root, so no other job ever executes them: the FIB's
        # seg6local programming, the AF_PACKET transport, and the daemon's
        # SIGHUP handler are only covered here. That last one is why the daemon
        # survives a reload request at all -- SIGHUP's default disposition
        # terminates the process -- so a job that never runs it is a job that
        # would not notice.
        # Built as the runner user and only executed under sudo, like the
        # interop binary below: running `go` itself as root leaves root-owned
        # entries in the build cache that break every later step.
        run: |
          sudo /tmp/fib.test -test.v
          sudo /tmp/datalink.test -test.v
          sudo /tmp/goisisd.test -test.v
      - name: Build interop tests
        run: go test -c -o /tmp/interop.test ./test/interop
      # 30m, not the suite's nominal runtime: a single genuine failure must
      # still be reported as a failure rather than as a timeout panic that
      # buries it, and the failure paths are long. The suite is now fourteen
      # tests holding thirty-six 90s waitUps -- the inter-level one has eight
      # of them across four containers -- plus two 150s soft waits in the LAN
      # route and reload tests. Raise this whenever a test is added, or the
      # first slow day buries the assertion that actually failed.
      - name: Run interop (needs root for AF_PACKET + veth; PATH kept for `go`)
        run: sudo env "PATH=$PATH" /tmp/interop.test -test.v -test.timeout 30m
